name: Fare Monitor

on:
  schedule:
    # 13:30 UTC Tuesday. swa-checker runs at 13:15 on the same shared SerpApi
    # key and gets first claim on quota, because it re-prices already-booked
    # flights (real rebooking credit) while this repo is speculative shopping.
    # Note GitHub cron is fixed UTC, so this is 6:30am PT in summer and
    # 5:30am PT in winter.
    #
    # Moved from 14:30 on 2026-09-01, in step with swa-checker's 14:15 -> 13:15,
    # to keep the 15 min ordering gap. Both repos' runs in the 14:00-15:00 UTC
    # hour were dropped outright by GitHub that day; separately, queue delay off
    # the old cron was routinely 35-127 min, so fares were being sampled late
    # morning ET after SWA's East Coast sale posting had begun selling out.
    - cron: '30 13 * * 2'
  workflow_dispatch:          # manual trigger
    inputs:
      skip_monitor:
        description: 'Skip the fare search (use for testing workflow/infra changes only)'
        type: boolean
        default: false
      force_scan:
        description: 'Sweep even if today is not Tuesday (records post-sale prices — skews the baseline)'
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      # GitHub's cron now lands 4-5h late, so runs are started on time by
      # workflow_dispatch and the cron is only a fallback. A scheduled run skips
      # itself if a run today already got through the monitor (which sends the
      # email) — checked per step, since the timestamp push can fail after the
      # email has gone. Manual dispatches always run.
      - name: Skip if already ran today
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(date -u +%F)
          for id in $(gh run list -R "$GITHUB_REPOSITORY" -w "${{ github.workflow }}" -L 20 \
                        --json databaseId,createdAt,status \
                        --jq ".[] | select(.status==\"completed\" and (.createdAt|startswith(\"$today\"))) | .databaseId"); do
            ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                   --jq '[.jobs[].steps[] | select(.name=="Run monitor" and .conclusion=="success")] | length')
            if [ "$ok" -gt 0 ]; then
              echo "Run $id already sent today's email. Skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.12'

      - name: Install deps
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      # Restore history DB from prior runs
      - uses: dawidd6/action-download-artifact@v3
        if: steps.guard.outputs.skip != 'true'
        with:
          name: fare-history
          path: fare_monitor/
        continue-on-error: true

      # Restore cache from prior runs
      - uses: dawidd6/action-download-artifact@v3
        if: steps.guard.outputs.skip != 'true'
        with:
          name: fare-cache
          path: fare_monitor/cache/
        continue-on-error: true

      - name: Run monitor
        if: ${{ steps.guard.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.skip_monitor != true) }}
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python -m fare_monitor.monitor ${{ inputs.force_scan && '--force' || '' }}

      # Persist history DB — runs even if monitor fails
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.guard.outputs.skip != 'true' }}
        with:
          name: fare-history
          path: fare_monitor/fare_history.db
          overwrite: true

      # Persist cache — runs even if monitor fails
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.guard.outputs.skip != 'true' }}
        with:
          name: fare-cache
          path: fare_monitor/cache/
          overwrite: true

      # Commit a timestamp so GitHub doesn't disable the scheduled workflow
      - name: Record run timestamp
        if: ${{ always() && steps.guard.outputs.skip != 'true' }}
        run: |
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > last_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_run.txt
          git diff --staged --quiet || git commit -m "chore: fare monitor run $(date -u +%Y-%m-%d)"
          git pull --rebase -q && git push
